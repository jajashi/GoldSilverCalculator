<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="180" y2="0">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="40" x2="180" y2="0">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="40%" stop-color="#D1D5DB"/>
      <stop offset="80%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
  </defs>

  <!-- Gold bar -->
  <rect x="4" y="10" width="52" height="20" rx="6" fill="url(#goldGrad)" />
  <rect x="8" y="8" width="52" height="20" rx="6" fill="url(#goldGrad)" opacity="0.55" />

  <!-- Silver bar -->
  <rect x="32" y="16" width="52" height="18" rx="6" fill="url(#silverGrad)" />

  <!-- Brand text -->
  <text x="92" y="19" fill="#111827" font-size="13" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    Precious Metals
  </text>
  <text x="92" y="32" fill="#6B7280" font-size="10" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    Gold &amp; Silver Calculator
  </text>
</svg>
